---
- name: Remediate high CPU on application server
  hosts: all
  become: true
  gather_facts: false

  vars:
    app_health_url: "http://localhost:8080/health"
    app_dir: "/home/ec2-user/aiops-demo/app"

  tasks:

    - name: Check current application health
      ansible.builtin.uri:
        url: "{{ app_health_url }}"
        method: GET
        status_code:
          - 200
          - 503
        return_content: true
      register: health_before
      changed_when: false

    - name: Display current application state
      ansible.builtin.debug:
        msg:
          - "HTTP status: {{ health_before.status }}"
          - "Response: {{ health_before.content }}"

    - name: Find Product Catalog application process
      ansible.builtin.shell: |
        pgrep -f "python3.*app.py" || true
      register: app_pids
      changed_when: false

    - name: Display application PIDs
      ansible.builtin.debug:
        msg: "Application PIDs: {{ app_pids.stdout_lines }}"

    - name: Stop Product Catalog application
      ansible.builtin.shell: |
        pkill -f "python3.*app.py"
      when: app_pids.stdout | length > 0
      changed_when: true

    - name: Wait for old application to stop
      ansible.builtin.pause:
        seconds: 2

    - name: Start Product Catalog application
      ansible.builtin.shell: |
        cd {{ app_dir }}
        nohup python3 app.py > app.log 2>&1 &
      become_user: ec2-user

    - name: Wait for application startup
      ansible.builtin.pause:
        seconds: 3

    - name: Verify application health
      ansible.builtin.uri:
        url: "{{ app_health_url }}"
        method: GET
        status_code: 200
        return_content: true
      register: health_after
      retries: 5
      delay: 2
      until: health_after.status == 200

    - name: Display remediation result
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - " AIOps Remediation Completed"
          - "=========================================="
          - "Application HTTP status: {{ health_after.status }}"
          - "Application response: {{ health_after.content }}"
